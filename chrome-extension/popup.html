<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fight Alerts</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 12px;
        width: 300px;
        color: #e8eaed;
        background: #12151a;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 10px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      label {
        display: block;
        font-size: 11px;
        color: #9aa3b2;
        margin: 8px 0 4px;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #2a313c;
        border-radius: 4px;
        background: #1a1f27;
        color: #e8eaed;
        font-size: 12px;
      }
      .status {
        font-size: 12px;
        padding: 8px;
        border-radius: 4px;
        background: #1a1f27;
        border: 1px solid #2a313c;
        word-break: break-word;
        white-space: pre-wrap;
      }
      .status.live { border-color: #2a9d5c; color: #7ddea8; }
      .status.connecting { border-color: #d4a017; color: #e6c35c; }
      .status.down, .status.err, .status.off { border-color: #c45c3e; color: #f0a090; }
      button {
        margin-top: 8px;
        width: 100%;
        padding: 8px;
        border: 0;
        border-radius: 4px;
        background: #c45028;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: #2a313c;
        color: #e8eaed;
      }
      .hint {
        margin-top: 10px;
        font-size: 10px;
        color: #7a8494;
        line-height: 1.45;
      }
      .recent {
        margin-top: 10px;
        max-height: 220px;
        overflow: auto;
        border-top: 1px solid #2a313c;
        padding-top: 8px;
      }
      .recent h2 {
        margin: 0 0 6px;
        font-size: 10px;
        letter-spacing: 0.08em;
        color: #9aa3b2;
      }
      .recent div {
        font-size: 11px;
        padding: 4px 0;
        border-bottom: 1px solid #1a1f27;
        color: #c5ccd6;
      }
      code { color: #b8c0cc; }
    </style>
  </head>
  <body>
    <h1>Fight Aggression Alerts</h1>
    <div id="status" class="status">Checking…</div>
    <label>
      <input type="checkbox" id="enabled" /> Enabled
    </label>
    <label for="wsUrl">WebSocket URL</label>
    <input id="wsUrl" type="text" spellcheck="false" />
    <label for="uiUrl">Open UI URL (on click)</label>
    <input id="uiUrl" type="text" spellcheck="false" />
    <button id="save" type="button">Save & reconnect</button>
    <button id="test" class="secondary" type="button">Test notification</button>
    <div class="recent">
      <h2>Recent alerts</h2>
      <div id="recent">None yet</div>
    </div>
    <p class="hint">
      After update: <code>chrome://extensions</code> → <b>Reload</b> this extension.<br />
      Click <b>Test notification</b> — if that fails, allow Chrome notifications in macOS Settings.<br />
      Alerts need the fight server running on 8787.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
